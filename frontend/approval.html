<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approval Queue — AI Chief of Staff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #00f0ff;
        }

        .status {
            font-size: 14px;
            color: #666;
        }

        .approvals {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .approval-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .approval-card.processing {
            opacity: 0.6;
            pointer-events: none;
        }

        .approval-type {
            display: inline-block;
            background: #00f0ff;
            color: #000;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .approval-type.email {
            background: #8A2BE2;
        }

        .approval-type.crm {
            background: #00FF87;
        }

        .approval-type.calendar {
            background: #FFB800;
        }

        .approval-subject {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fff;
        }

        .approval-details {
            font-size: 13px;
            color: #999;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .approval-details strong {
            color: #e0e0e0;
        }

        .approval-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-approve {
            background: #00FF87;
            color: #000;
        }

        .btn-approve:hover {
            background: #00dd6f;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 135, 0.3);
        }

        .btn-approve:active {
            transform: translateY(0);
        }

        .btn-deny {
            background: #333;
            color: #e0e0e0;
        }

        .btn-deny:hover {
            background: #444;
            transform: translateY(-2px);
        }

        .btn-deny:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-approved {
            display: inline-block;
            background: #00FF87;
            color: #000;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
        }

        .status-denied {
            display: inline-block;
            background: #FF2E63;
            color: #fff;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-state-subtext {
            font-size: 12px;
            color: #555;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }

        .refresh-button {
            display: block;
            margin: 20px auto;
            padding: 12px 24px;
            background: #00f0ff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .refresh-button:hover {
            background: #00dd6f;
            transform: translateY(-2px);
        }

        .loading-indicator {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #00f0ff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Approval Queue</h1>
            <div class="status"><span id="count">0</span> pending actions</div>
        </header>

        <div id="approvals" class="approvals"></div>

        <div id="empty" class="empty-state" style="display: none;">
            <div class="empty-state-icon">✅</div>
            <div class="empty-state-text">All caught up!</div>
            <div class="empty-state-subtext">No pending approvals</div>
        </div>

        <button class="refresh-button" onclick="loadApprovals()">🔄 Refresh</button>

        <footer>
            <p>AI Chief of Staff • Getty Group Demo</p>
        </footer>
    </div>

    <script>
        // Mock approvals for demo
        const mockApprovals = [
            {
                id: "app-001",
                type: "email",
                subject: "Quick catch-up?",
                details: `To: marcus@example.com\nSubject: Quick catch-up?\n\nDraft: "Hey Marcus, we've been meaning to connect. Free for a 15-min call this week? —Shawn"`,
                created: new Date(Date.now() - 2 * 60000)
            },
            {
                id: "app-002",
                type: "crm",
                subject: "Update contact record",
                details: `Contact: Marcus Chen\nField: last_contact_date\nNew value: ${new Date().toLocaleDateString()}`,
                created: new Date(Date.now() - 1 * 60000)
            },
            {
                id: "app-003",
                type: "calendar",
                subject: "Block calendar time",
                details: `Event: Call with Marcus Chen (Recruiting)\nTime: Today at 3 PM\nDuration: 15 minutes`,
                created: new Date(Date.now() - 30000)
            }
        ];

        let approvals = [...mockApprovals];

        async function loadApprovals() {
            const container = document.getElementById("approvals");
            const empty = document.getElementById("empty");
            const count = document.getElementById("count");

            if (approvals.length === 0) {
                container.innerHTML = "";
                empty.style.display = "block";
                count.textContent = "0";
                return;
            }

            empty.style.display = "none";
            count.textContent = approvals.length;

            container.innerHTML = approvals.map(approval => `
                <div class="approval-card" id="card-${approval.id}">
                    <div class="approval-type ${approval.type}">${approval.type.toUpperCase()}</div>
                    <div class="approval-subject">${approval.subject}</div>
                    <div class="approval-details">${approval.details.replace(/\n/g, "<br>")}</div>
                    <div class="approval-actions">
                        <button class="btn-approve" onclick="approve('${approval.id}')">
                            ✓ Approve
                        </button>
                        <button class="btn-deny" onclick="deny('${approval.id}')">
                            ✗ Deny
                        </button>
                    </div>
                </div>
            `).join("");
        }

        async function approve(id) {
            const card = document.getElementById(`card-${id}`);
            card.classList.add("processing");

            const btn = card.querySelector(".btn-approve");
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="loading-indicator"></span>Sending...';
            btn.disabled = true;

            // Simulate API call
            await new Promise(r => setTimeout(r, 1500));

            // Replace card with success message
            card.innerHTML = `
                <div class="approval-subject">${card.querySelector(".approval-subject").textContent}</div>
                <div class="status-approved">✓ Approved & Sent</div>
            `;

            // Remove from list after 2 sec
            setTimeout(() => {
                approvals = approvals.filter(a => a.id !== id);
                loadApprovals();
            }, 2000);
        }

        async function deny(id) {
            const card = document.getElementById(`card-${id}`);
            card.classList.add("processing");

            const btn = card.querySelector(".btn-deny");
            btn.textContent = "✗ Denied";
            btn.disabled = true;

            // Replace card with deny message
            card.innerHTML = `
                <div class="approval-subject">${card.querySelector(".approval-subject").textContent}</div>
                <div class="status-denied">✗ Denied</div>
            `;

            // Remove from list after 2 sec
            setTimeout(() => {
                approvals = approvals.filter(a => a.id !== id);
                loadApprovals();
            }, 2000);
        }

        // Load on page load
        loadApprovals();

        // Poll for new approvals every 3 sec
        setInterval(loadApprovals, 3000);
    </script>
</body>
</html>
